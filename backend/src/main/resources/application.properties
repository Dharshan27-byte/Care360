spring.application.name=care360-api
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:5000}
server.error.include-message=never
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/care360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
care360.jwt-expiration-hours=${JWT_EXPIRATION_HOURS:12}
care360.jwt-secret=${CARE360_JWT_SECRET:care360-local-development-secret-change-before-deployment-2026}
